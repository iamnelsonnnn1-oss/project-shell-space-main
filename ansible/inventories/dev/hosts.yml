---
# Host IP comes from: terraform output app_external_ip (Cloudflare proxies public traffic).
all:
  children:
    shell_space:
      children:
        app:
          hosts:
            shell-space-app-dev:
              ansible_host: REPLACE_WITH_TERRAFORM_APP_EXTERNAL_IP # reach it via IAP: gcloud compute config-ssh --ssh-config-file with --tunnel-through-iap
              ansible_user: REPLACE_WITH_OSLOGIN_USER # from: gcloud compute os-login describe-profile (e.g. you_gmail_com)
              ansible_ssh_private_key_file: ~/.ssh/google_compute_engine # created by gcloud compute ssh
        db:
          hosts:
            shell-space-app-dev: # Postgres shares the free-tier VM
