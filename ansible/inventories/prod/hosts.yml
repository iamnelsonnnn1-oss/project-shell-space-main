---
# Administration is IAP-only: Ansible reaches the VM through `gcloud compute start-iap-tunnel`
# (see ansible_ssh_common_args in group_vars). The VM's public IP is outbound-only and is never used here.
all:
  children:
    shell_space:
      children:
        app:
          hosts:
            shell-space-app-prod:
              ansible_user: REPLACE_WITH_OSLOGIN_USER # from: gcloud compute os-login describe-profile (e.g. you_gmail_com)
              ansible_ssh_private_key_file: ~/.ssh/google_compute_engine # created by gcloud compute ssh
        db:
          hosts:
            shell-space-app-prod: # Postgres shares the VM
