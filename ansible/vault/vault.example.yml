vault_origin_cert: |
  -----BEGIN CERTIFICATE-----
  REPLACE_WITH_CLOUDFLARE_ORIGIN_CERT
  -----END CERTIFICATE-----
vault_origin_key: |
  -----BEGIN PRIVATE KEY-----
  REPLACE_WITH_CLOUDFLARE_ORIGIN_KEY
  -----END PRIVATE KEY-----
