---
- name: Create unprivileged app user
  ansible.builtin.user:
    name: "{{ compute_app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create app directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ compute_app_user }}"
    group: "{{ compute_app_user }}"
    mode: "0755"
  loop:
    - "{{ compute_app_root }}"
    - "{{ compute_web_root }}"

- name: Create API directory
  ansible.builtin.file:
    path: "{{ compute_api_root }}"
    state: directory
    owner: "{{ compute_app_user }}"
    group: "{{ compute_app_user }}"
    mode: "0755"

- name: Install NodeSource signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Add NodeSource repository for the pinned major
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ compute_node_major }}.x nodistro main"
    filename: nodesource
    state: present

- name: Pin nodejs to the chosen major
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nodejs
    content: |
      Package: nodejs
      Pin: version {{ compute_node_major }}.*
      Pin-Priority: 1001
    owner: root
    group: root
    mode: "0644"

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Create environment directory
  ansible.builtin.file:
    path: "{{ compute_env_dir }}"
    state: directory
    owner: root
    group: "{{ compute_app_user }}"
    mode: "0750"

- name: Render API environment file
  ansible.builtin.template:
    src: api.env.j2
    dest: "{{ compute_env_dir }}/api.env"
    owner: root
    group: "{{ compute_app_user }}"
    mode: "0640"
  no_log: true

- name: Install API systemd unit
  ansible.builtin.template:
    src: shell-space-api.service.j2
    dest: /etc/systemd/system/shell-space-api.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable API service (started by the release process once an artifact exists)
  ansible.builtin.systemd:
    name: shell-space-api
    enabled: true
    daemon_reload: true
