---
- name: Fail if no SSH allow-list is defined (prevents lockout or open SSH)
  ansible.builtin.assert:
    that: security_ssh_allowed_cidrs | length > 0
    fail_msg: "Set ssh_allowed_cidrs in the inventory group_vars."

- name: Install security packages
  ansible.builtin.apt:
    name: "{{ security_packages }}"
    state: present

- name: Harden sshd (key-only, no root)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-shell-space-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3
    validate: "sshd -t -f %s"
  notify: Restart sshd

- name: Allow SSH from admin CIDRs (before enabling the firewall)
  community.general.ufw:
    rule: allow
    port: "{{ security_ssh_port }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ security_ssh_allowed_cidrs }}"

- name: Default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Default allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Enable ufw
  community.general.ufw:
    state: enabled

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
