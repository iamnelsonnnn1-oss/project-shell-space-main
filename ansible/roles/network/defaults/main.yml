---
network_domain: "{{ domain_name }}"
network_web_root: "{{ compute_web_root | default('/srv/shell-space/current') }}"
# nginx listens on loopback only; cloudflared connects to it. No public listener.
network_listen_address: 127.0.0.1
network_listen_port: 8080
network_api_upstream: 127.0.0.1:3000
